services:
  recipes:
    container_name: recipes
    build: .
    restart: unless-stopped
    ports:
      - "12345:12345"
    volumes:
      - .:/app

    networks:
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.recipes.rule=Host(`recipes.docker.localhost`)"
      - "traefik.http.routers.recipes.entrypoints=websecure"
      - "traefik.http.routers.recipes.tls=true"
      - "traefik.http.services.recipes.loadbalancer.server.port=12345"

networks:
  proxy:
    name: proxy
    external: true